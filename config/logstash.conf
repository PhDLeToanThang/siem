#===============================================================================
# Logstash Pipeline Configuration - SIEM 9.4.2
# Path: /etc/logstash/conf.d/
#===============================================================================

# 01-syslog-input.conf
input {
  syslog {
    type => "syslog"
    port => 5514
  }
  beats {
    port => 5044
    ssl => true
    ssl_certificate => "/etc/logstash/certs/fullchain.pem"
    ssl_key => "/etc/logstash/certs/logstash.pkcs8.key"
    ssl_verify_mode => "none"
  }
  http {
    id => "dsiem_input"
    port => 8081
    codec => json
  }
}

# 10-siem-filter.conf
filter {
  if [type] == "syslog" {
    grok {
      match => { "message" => "%{SYSLOG5424PRI:syslog_pri}%{SYSLOG5424LINE:message}" }
      overwrite => ["message"]
    }
    date {
      match => [ "timestamp", "MMM  d HH:mm:ss", "MMM dd HH:mm:ss", "ISO8601" ]
      target => "@timestamp"
    }
    mutate {
      add_field => { "event_module" => "syslog" }
    }
  }

  # Add SIEM-specific fields
  if ![siem_event_type] {
    mutate {
      add_field => { "siem_event_type" => "%{[type]}" }
    }
  }

  # GeoIP enrichment (if available)
  if [source][ip] {
    geoip {
      source => "[source][ip]"
      target => "[source][geo]"
    }
  }
  if [destination][ip] {
    geoip {
      source => "[destination][ip]"
      target => "[destination][geo]"
    }
  }

  # Remove sensitive data
  mutate {
    remove_field => ["[event][original]", "[host][hostname]"]
  }
}

# 30-elasticsearch-output.conf
output {
  if [siem_event_type] {
    elasticsearch {
      hosts => ["https://localhost:9200"]
      cacert => "/etc/logstash/certs/fullchain.pem"
      user => "logstash_writer"
      password => "${LSW_PASS}"
      index => "siem-events-%{+YYYY.MM.dd}"
      template_name => "siem-events-template"
    }
  }

  # DSIEM forward for correlation
  if [siem_event_type] {
    http {
      url => "http://localhost:8080/api/events"
      http_method => "post"
      format => "json"
      mapping => {
        "title" => "%{[event][action]}"
        "source_ip" => "%{[source][ip]}"
        "dest_ip" => "%{[destination][ip]}"
        "event_type" => "%{[siem_event_type]}"
        "timestamp" => "%{[@timestamp]}"
      }
    }
  }
}
